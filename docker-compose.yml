services:
  web:
    build: .
    ports:
      - "5020:5000"
    environment:
      COURIER_WEBHOOK_SECRET: "change-me-in-production"
      FLAG: "flag{...}"
      REPORT_ISSUE_URL: "https://startx.team"
      DATABASE_PATH: /app/data/shipments.db
      INACTIVE_SHIPMENT_RETENTION_HOURS: "72"
      PROCESSED_EVENT_RETENTION_SECONDS: "14400"
      CLEANUP_INTERVAL_SECONDS: "7200"
    volumes:
      - courier-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  courier-data: